<script>
    // ==========================================
    // МАТРИЧНЫЙ ФОН
    // ==========================================
    const matrixCanvas = document.getElementById('matrix-bg');
    const matrixCtx = matrixCanvas.getContext('2d');
    
    matrixCanvas.width = window.innerWidth;
    matrixCanvas.height = window.innerHeight;
    
    const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789';
    const charArray = chars.split('');
    const fontSize = 14;
    const columns = matrixCanvas.width / fontSize;
    const drops = [];
    
    for (let i = 0; i < columns; i++) {
        drops[i] = Math.random() * -100;
    }
    
    function drawMatrix() {
        matrixCtx.fillStyle = 'rgba(0, 0, 0, 0.05)';
        matrixCtx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
        
        matrixCtx.fillStyle = '#00ff41';
        matrixCtx.font = fontSize + 'px monospace';
        
        for (let i = 0; i < drops.length; i++) {
            const text = charArray[Math.floor(Math.random() * charArray.length)];
            matrixCtx.fillText(text, i * fontSize, drops[i] * fontSize);
            
            if (drops[i] * fontSize > matrixCanvas.height && Math.random() > 0.975) {
                drops[i] = 0;
            }
            drops[i]++;
        }
    }
    
    setInterval(drawMatrix, 35);
    
    window.addEventListener('resize', () => {
        matrixCanvas.width = window.innerWidth;
        matrixCanvas.height = window.innerHeight;
    });
    
    // ==========================================
    // РЕАЛЬНЫЙ ЭКВАЛАЙЗЕР (БЕЗОПАСНАЯ ВЕРСИЯ)
    // ==========================================
    const audio = document.getElementById('audioPlayer');
    const eqCanvas = document.getElementById('equalizer');
    const eqCtx = eqCanvas.getContext('2d');
    const eqStatus = document.getElementById('eqStatus');
    
    let audioContext = null;
    let analyser = null;
    let dataArray = null;
    let bufferLength = 0;
    let isInitialized = false;
    let initFailed = false;
    
    function resizeEqCanvas() {
        const wrapper = eqCanvas.parentElement;
        eqCanvas.width = wrapper.clientWidth;
        eqCanvas.height = wrapper.clientHeight;
    }
    
    resizeEqCanvas();
    window.addEventListener('resize', resizeEqCanvas);
    
    // Инициализация ТОЛЬКО при первом клике на play
    function initAudioContext() {
        if (isInitialized || initFailed) return;
        
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            if (!AudioContext) {
                initFailed = true;
                return;
            }
            
            audioContext = new AudioContext();
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 256;
            analyser.smoothingTimeConstant = 0.8;
            
            bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
            
            const source = audioContext.createMediaElementSource(audio);
            source.connect(analyser);
            analyser.connect(audioContext.destination);
            
            isInitialized = true;
            console.log('AudioContext initialized');
        } catch (e) {
            console.warn('AudioContext init failed:', e);
            initFailed = true;
            // Звук всё равно будет работать, просто без эквалайзера
        }
    }
    
    function drawEqualizer() {
        requestAnimationFrame(drawEqualizer);
        
        const width = eqCanvas.width;
        const height = eqCanvas.height;
        
        eqCtx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        eqCtx.fillRect(0, 0, width, height);
        
        // Сетка
        eqCtx.strokeStyle = 'rgba(0, 255, 65, 0.08)';
        eqCtx.lineWidth = 1;
        for (let i = 0; i < width; i += 20) {
            eqCtx.beginPath();
            eqCtx.moveTo(i, 0);
            eqCtx.lineTo(i, height);
            eqCtx.stroke();
        }
        for (let i = 0; i < height; i += 20) {
            eqCtx.beginPath();
            eqCtx.moveTo(0, i);
            eqCtx.lineTo(width, i);
            eqCtx.stroke();
        }
        
        if (!isInitialized || audio.paused) {
            // Режим ожидания - лёгкая анимация
            const barCount = 64;
            const barWidth = width / barCount;
            const time = Date.now() / 1000;
            
            for (let i = 0; i < barCount; i++) {
                const barHeight = 8 + Math.sin(time * 2 + i * 0.3) * 4;
                const x = i * barWidth;
                const y = height - barHeight;
                
                eqCtx.fillStyle = '#003b00';
                eqCtx.fillRect(x, y, barWidth - 2, barHeight);
            }
            return;
        }
        
        if (initFailed || !analyser) {
            // Fallback - симуляция на основе currentTime
            const barCount = 64;
            const barWidth = width / barCount;
            const time = audio.currentTime;
            
            for (let i = 0; i < barCount; i++) {
                const pseudoValue = Math.abs(Math.sin(time * 3 + i * 0.5)) * 0.7 + Math.random() * 0.3;
                const barHeight = pseudoValue * height * 0.8;
                const x = i * barWidth;
                const y = height - barHeight;
                
                const gradient = eqCtx.createLinearGradient(0, y, 0, height);
                gradient.addColorStop(0, '#00ff41');
                gradient.addColorStop(1, '#003b00');
                eqCtx.fillStyle = gradient;
                eqCtx.fillRect(x, y, barWidth - 2, barHeight);
            }
            return;
        }
        
        // Реальный анализ
        analyser.getByteFrequencyData(dataArray);
        
        const barWidth = width / bufferLength;
        let x = 0;
        
        for (let i = 0; i < bufferLength; i++) {
            const barHeight = (dataArray[i] / 255) * height;
            const y = height - barHeight;
            
            const gradient = eqCtx.createLinearGradient(0, y, 0, height);
            gradient.addColorStop(0, '#00ff41');
            gradient.addColorStop(0.5, '#00cc33');
            gradient.addColorStop(1, '#003b00');
            
            eqCtx.fillStyle = gradient;
            eqCtx.fillRect(x, y, barWidth - 1, barHeight);
            
            // Свечение на пике
            eqCtx.shadowBlur = 8;
            eqCtx.shadowColor = '#00ff41';
            eqCtx.fillRect(x, y, barWidth - 1, 2);
            eqCtx.shadowBlur = 0;
            
            x += barWidth;
        }
    }
    
    drawEqualizer();
    
    // Обработчики плеера
    audio.addEventListener('play', () => {
        // Инициализируем при первом play (требование браузеров)
        if (!isInitialized && !initFailed) {
            initAudioContext();
        }
        
        if (audioContext && audioContext.state === 'suspended') {
            audioContext.resume();
        }
        
        eqStatus.textContent = 'ANALYZING...';
        eqStatus.classList.add('active');
    });
    
    audio.addEventListener('pause', () => {
        eqStatus.textContent = 'STANDBY';
        eqStatus.classList.remove('active');
    });
    
    audio.addEventListener('ended', () => {
        eqStatus.textContent = 'COMPLETE';
        eqStatus.classList.remove('active');
    });
    
    audio.addEventListener('error', (e) => {
        console.error('Audio error:', e);
        eqStatus.textContent = 'ERROR';
    });
    
    // ==========================================
    // ЭФФЕКТ ПЕЧАТНОЙ МАШИНКИ
    // ==========================================
    const title = document.querySelector('h1');
    const originalText = title.textContent;
    title.textContent = '';
    let charIndex = 0;
    
    setTimeout(() => {
        const typeWriter = setInterval(() => {
            if (charIndex < originalText.length) {
                title.textContent += originalText.charAt(charIndex);
                charIndex++;
            } else {
                clearInterval(typeWriter);
            }
        }, 100);
    }, 500);
</script>
