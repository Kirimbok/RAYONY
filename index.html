<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ТЁМНЫЙ РАЙОН</title>
    <style>
        :root {
            --bg-color: #050505;
            --text-color: #00ff41;
            --secondary: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Courier New', monospace;
            overflow-x: hidden;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Визуализатор */
        .visualizer {
            width: 100%;
            height: 200px;
            background: linear-gradient(180deg, #0a0a0a 0%, #1a1a1a 100%);
            border: 1px solid #333;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.1);
        }

        .visualizer-bar {
            position: absolute;
            bottom: 0;
            width: 4px;
            background: linear-gradient(0deg, #00ff41, #00cc33);
            animation: visualize 0.5s ease-in-out infinite;
            box-shadow: 0 0 10px #00ff41;
        }

        @keyframes visualize {
            0%, 100% { height: 10%; }
            50% { height: 90%; }
        }

        /* Генерация баров визуализатора */
        .visualizer-bar:nth-child(1) { left: 10%; animation-delay: 0s; }
        .visualizer-bar:nth-child(2) { left: 20%; animation-delay: 0.1s; }
        .visualizer-bar:nth-child(3) { left: 30%; animation-delay: 0.2s; }
        .visualizer-bar:nth-child(4) { left: 40%; animation-delay: 0.15s; }
        .visualizer-bar:nth-child(5) { left: 50%; animation-delay: 0.3s; }
        .visualizer-bar:nth-child(6) { left: 60%; animation-delay: 0.2s; }
        .visualizer-bar:nth-child(7) { left: 70%; animation-delay: 0.1s; }
        .visualizer-bar:nth-child(8) { left: 80%; animation-delay: 0.25s; }
        .visualizer-bar:nth-child(9) { left: 90%; animation-delay: 0.15s; }

        h1 {
            text-align: center;
            font-size: 3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 20px rgba(0, 255, 65, 0.5);
            animation: glitch 3s infinite;
        }

        .track-info {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--secondary);
            border: 1px solid #333;
        }

        .track-info p {
            margin: 5px 0;
            font-size: 1.1rem;
        }

        .track-info span {
            color: #888;
        }

        /* Плеер */
        .player {
            width: 100%;
            margin-bottom: 40px;
            filter: invert(1) hue-rotate(180deg);
        }

        /* Галерея обложек */
        .covers-gallery {
            margin: 40px 0;
        }

        .cover-item {
            margin-bottom: 40px;
            border: 1px solid #333;
            background: #0a0a0a;
            padding: 15px;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .cover-item:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 30px rgba(0, 255, 65, 0.2);
        }

        .cover-item img {
            width: 100%;
            height: auto;
            display: block;
            filter: contrast(1.1);
        }

        .cover-label {
            text-align: center;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #666;
        }

        footer {
            text-align: center;
            padding: 30px;
            border-top: 1px solid #333;
            color: #444;
            font-size: 0.8rem;
        }

        @keyframes glitch {
            0%, 90%, 100% { transform: translate(0); }
            92% { transform: translate(-2px, 2px); }
            94% { transform: translate(2px, -2px); }
            96% { transform: translate(-2px, -2px); }
            98% { transform: translate(2px, 2px); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .visualizer { height: 150px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Визуализатор -->
    <div class="visualizer">
        <div class="visualizer-bar"></div>
        <div class="visualizer-bar"></div>
        <div class="visualizer-bar"></div>
        <div class="visualizer-bar"></div>
        <div class="visualizer-bar"></div>
        <div class="visualizer-bar"></div>
        <div class="visualizer-bar"></div>
        <div class="visualizer-bar"></div>
        <div class="visualizer-bar"></div>
    </div>

    <h1>ТЁМНЫЙ РАЙОН</h1>

    <!-- Инфо о треке -->
    <div class="track-info">
        <p><span>ТЕМП:</span> 140 BPM</p>
        <p><span>ТОНАЛЬНОСТЬ:</span> C# Minor</p>
    </div>

    <!-- Плеер -->
    <audio class="player" controls>
        <source src="rayony.m4a" type="audio/mp4">
    </audio>

    <!-- Галерея обложек -->
    <div class="covers-gallery">
        
        <!-- Обложка 1: Синий дым -->
        <div class="cover-item">
            <img src="cover.png" alt="Обложка 1: Темный Район">
            <div class="cover-label">VERSION 01 // BLUE SMOKE</div>
        </div>

        <!-- Обложка 2: Зеленая волна -->
        <div class="cover-item">
            <img src="cover_wave.png" alt="Обложка 2: Звуковая волна">
            <div class="cover-label">VERSION 02 // DIGITAL WAVE</div>
        </div>

        <!-- Обложка 3: Система сломана -->
        <div class="cover-item">
            <img src="cover_glitch.png" alt="Обложка 3: Глитч">
            <div class="cover-label">VERSION 03 // SYSTEM BROKEN</div>
        </div>

    </div>

    <footer>
        PROTOCOL X = 0<br>
        NO EXPECTATIONS // JUST REALITY
    </footer>
</div>

<script>
    // Анимация визуализатора реагирует на аудио
    const audio = document.querySelector('audio');
    const bars = document.querySelectorAll('.visualizer-bar');
    
    audio.addEventListener('play', () => {
        bars.forEach(bar => {
            bar.style.animationDuration = `${0.3 + Math.random() * 0.4}s`;
        });
    });
    
    audio.addEventListener('pause', () => {
        bars.forEach(bar => {
            bar.style.animationDuration = '0.5s';
        });
    });
</script>

</body>
</html>
